[project]
name = "projet-api-rest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bambanourathmaimouna", email = "bambanourathmaimouna@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "loguru>=0.7.3",
    "passlib[argon2,bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
projet-api-rest = "projet_api_rest:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
